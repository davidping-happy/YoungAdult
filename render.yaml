# Render Blueprint: API + Admin (DB on Neon; free tier)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: youngadult-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate; node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: APK_MIRROR_URL
        value: https://github.com/davidping-happy/YoungAdult/releases/download/v1.1.9-preview/youngadult-1.1.9.apk
      - key: APK_FILE_NAME
        value: youngadult-1.1.9.apk
      - key: CORS_ORIGINS
        value: "http://localhost:3001,http://127.0.0.1:3001,http://localhost:8081,http://127.0.0.1:8081,https://youngadult-admin.onrender.com"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900s
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        value: UCdcDDnZj76AwNqj18jtTAgw
      - key: YOUTUBE_CHANNEL_URL
        value: https://www.youtube.com/@breadoflifechristianchurch9830
      - key: YOUTUBE_ZONE_CHANNEL_ID
        value: UCjqMaLCix8DJQTLoLTZtFHA
      - key: YOUTUBE_ZONE_CHANNEL_URL
        value: https://www.youtube.com/@高雄靈糧堂社青牧區
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: BRAND_NAME
        value: ????

  - type: web
    name: youngadult-admin
    runtime: node
    plan: free
    rootDir: apps/admin-web
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build:render
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_BASE
        value: https://youngadult-api.onrender.com/api
      - key: EXPO_PUBLIC_API_BASE
        value: https://youngadult-api.onrender.com/api
      - key: APK_MIRROR_URL
        value: https://github.com/davidping-happy/YoungAdult/releases/download/v1.1.8-preview/youngadult-1.1.8.apk
      - key: APK_FILE_NAME
        value: youngadult-1.1.8.apk
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
